name: fx-pulse
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      TRUST_PROXY: "true"
      NODE_ENV: production
    expose:
      - "3000"
    volumes:
      - fxpulse_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w pliku .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  fxpulse_data:
  caddy_data:
  caddy_config:
